<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un module</title>
</head>
<body>
    <h1>Ajouter un nouveau module KNX</h1>
    <form method="POST">
        <label>Nom du module :</label><br>
        <input type="text" name="nom" required><br><br>

        <label>Catégorie :</label><br>
        <input type="text" name="categorie"><br><br>

        <label>Description technique :</label><br>
        <textarea name="description" rows="6" cols="40"></textarea><br><br>

        <button type="submit">Enregistrer</button>
    </form>
</body>
</html>
